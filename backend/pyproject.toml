[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# I cubre el orden de imports (equivalente a isort, profile black)
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# B008: falso positivo con Depends()/File() de FastAPI, es el patrón idiomático
# SIM905: la lista de stopwords queda más legible como texto + split()
ignore = ["E501", "B008", "SIM905"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
